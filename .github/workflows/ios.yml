# Builds Daldal on GitHub's Macs. Every push to main produces an unsigned .ipa, published as the
# "latest" release:  https://github.com/<owner>/<repo>/releases/latest/download/Daldal-unsigned.ipa
# Unsigned: install it with Sideloadly or AltStore, which sign it with your own Apple ID.
name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to publish the release

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Daldal.xcodeproj -scheme Daldal -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -clonedSourcePackagesDirPath build/SourcePackages \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*(deprecated|unavailable)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Daldal.app Payload/
          zip -qry Daldal-unsigned.ipa Payload
          ls -lh Daldal-unsigned.ipa

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Daldal build ${{ github.run_number }}
          make_latest: true
          files: Daldal-unsigned.ipa
          body: |
            Unsigned build of ${{ github.sha }}.
            Install with Sideloadly or AltStore (they sign it with your Apple ID).

  test:
    name: Unit tests (Simulator)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Test
        run: |
          set -o pipefail
          # The app targets iOS 26, so it needs an iOS 26 iPhone simulator; download one if the runner lacks it.
          pick() { xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS-26' in k for x in v if x['name'].startswith('iPhone')), ''))"; }
          DEVICE=$(pick)
          if [ -z "$DEVICE" ]; then xcodebuild -downloadPlatform iOS; DEVICE=$(pick); fi
          echo "Simulator: $DEVICE"
          # A phone standing near the Imam Husayn shrine in Karbala, with location already allowed.
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl privacy "$DEVICE" grant location-always app.daldal.ios || true
          xcrun simctl location "$DEVICE" set 32.6200,44.0300 || true
          xcodebuild test -project Daldal.xcodeproj -scheme Daldal -destination "id=$DEVICE" -resultBundlePath Results.xcresult \
            -skipMacroValidation -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO | tee test.log | grep -E "error:|Test .*(passed|failed)|TEST (SUCCEEDED|FAILED)|XCTAssert" || true
          grep -q "TEST SUCCEEDED" test.log
      - name: Export UI test screenshots
        if: always()
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path Results.xcresult --output-path screenshots || true
          ls screenshots | head -40
      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots
      - name: Print crash reports
        if: failure()
        run: |
          # Simulator app crashes are written on the host; print Daldal's so the log names the crashing line.
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/Daldal*.ips 2>/dev/null | head -3); do
            echo "=== $f"; head -c 60000 "$f"; echo
          done
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
