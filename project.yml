# XcodeGen spec. On a Mac: `brew install xcodegen && xcodegen generate`, then open Daldal.xcodeproj.
name: Daldal
options:
  bundleIdPrefix: app.daldal
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en # Source strings are English; Arabic lives in the string catalogs.
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_TEAM: "" # set your Apple team ID here

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.14.0 # 6.10+ reads local PMTiles (offline map)
  Ferrostar:
    url: https://github.com/stadiamaps/ferrostar
    exactVersion: 0.59.0 # Pre-1.0: pin exactly and upgrade on purpose.
  MapLibreSwiftUI:
    url: https://github.com/maplibre/swiftui-dsl
    from: 0.26.1 # Same range Ferrostar 0.59 requires; Drive Mode uses its camera type.
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk
    from: 3.4.0 # Voice assistant (test): ElevenLabs Conversational AI over LiveKit WebRTC.
  ValhallaMobile:
    url: https://github.com/Rallista/valhalla-mobile
    exactVersion: 0.6.4 # Valhalla 3.9; the pack's routing tiles must be built with the same version.
  ValhallaModels:
    url: https://github.com/Rallista/valhalla-openapi-models-swift
    from: 0.6.0

targets:
  Daldal:
    type: application
    platform: iOS
    sources:
      - path: Daldal
        excludes: ["Resources/Fonts/**"]
      # Map label glyphs (Noto Sans, SIL OFL), kept as a folder: MapLibre reads Fonts/<font>/<range>.pbf.
      - path: Daldal/Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: MapLibre
      - package: Ferrostar
        product: FerrostarCore
      - package: Ferrostar
        product: FerrostarMapLibreUI
      - package: MapLibreSwiftUI
        product: MapLibreSwiftUI
      - package: ValhallaMobile
        product: Valhalla
      - package: ElevenLabs
        product: ElevenLabs
      - package: ValhallaModels
        product: ValhallaConfigModels
      # "Share -> Daldal" in other apps (WhatsApp, Uber, Google Maps, Safari...).
      - target: DaldalShare
    info:
      path: Daldal/Info.plist
      properties:
        CFBundleDisplayName: دلدل
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleLocalizations: [ar, en]
        NSHumanReadableCopyright: "Designed and developed by Isaac Faleh Ali Almohammed (اسحاق فالح علي آل محمد)"
        # Phones set to a language we don't support yet (e.g. Kurdish) fall back to Arabic, not English.
        CFBundleDevelopmentRegion: ar
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities: [arm64, metal]
        # Turn-by-turn keeps guiding (position + voice) with the screen locked or another app open.
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: "Daldal uses your location to show where you are on the map, find places near you, and place heritage sites in AR."
        NSCameraUsageDescription: "Daldal uses the camera to show monuments and heritage sites in AR where they really stand."
        ITSAppUsesNonExemptEncryption: false
        # Filled from the ESRI_API_KEY GitHub secret at build time; empty means the free satellite imagery.
        EsriAPIKey: $(ESRI_API_KEY)
        # Public ElevenLabs agent for the voice assistant, from the ELEVENLABS_AGENT_ID GitHub secret.
        ElevenLabsAgentID: $(ELEVENLABS_AGENT_ID)
        NSMicrophoneUsageDescription: "Daldal uses the microphone only while you talk to the voice assistant."
        CFBundleURLTypes:
          - CFBundleURLName: app.daldal.location
            CFBundleURLSchemes: [daldal]
        NSLocationAlwaysAndWhenInUseUsageDescription: "With Always, Daldal tells you when you arrive at a monument you can explore in AR, even when the app is closed."
        NSPhotoLibraryAddUsageDescription: "Daldal saves dash-cam clips to your Photos when you ask, or after a sudden impact."
        NSMotionUsageDescription: "Daldal uses motion sensors to follow your car smoothly between GPS updates in Drive Scan."
        NSSpeechRecognitionUsageDescription: "Daldal turns what you say to the assistant into text, on your iPhone."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.daldal.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The emoji check reads the whole source tree.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Reject emoji in sources
        script: 'sh "${SRCROOT}/scripts/check-no-emoji.sh" "${SRCROOT}/Daldal"'
        basedOnDependencyAnalysis: false
    scheme:
      testTargets: [DaldalTests, DaldalUITests]

  DaldalShare:
    type: app-extension
    platform: iOS
    sources:
      - path: DaldalShare
      # The same link reader the app uses, so both understand exactly the same links.
      - path: Daldal/Search/LocationLink.swift
      - path: Daldal/Resources/Localizable.xcstrings
    info:
      path: DaldalShare/Info.plist
      properties:
        CFBundleDisplayName: دلدل
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: ar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.daldal.ios.share
        TARGETED_DEVICE_FAMILY: "1"

  DaldalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DaldalTests
    dependencies:
      - target: Daldal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  DaldalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DaldalUITests
    dependencies:
      - target: Daldal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
